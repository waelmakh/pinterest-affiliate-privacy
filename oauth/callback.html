<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connecting…</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background: #faf8f6; color: #222;
         display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
  .card { max-width: 420px; padding: 32px 28px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #666; font-size: 14px; line-height: 1.5; }
  code { display: block; margin-top: 14px; padding: 12px; background: #eee; border-radius: 8px;
         font-size: 13px; word-break: break-all; user-select: all; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Returning to the app…</h1>
  <p id="msg">If nothing happens, open the RTlapse app and paste this code:</p>
  <code id="code" class="hidden"></code>
</div>
<script>
  // OAuth bounce: forward the provider's query string to the app's custom
  // scheme. If the scheme doesn't launch, show the code for manual paste.
  (function () {
    var params = new URLSearchParams(location.search);
    var code = params.get("code");
    var error = params.get("error");
    var codeEl = document.getElementById("code");

    if (error) {
      document.getElementById("title").textContent = "Authorization failed";
      document.getElementById("msg").textContent = "The provider returned: " + error;
      return;
    }
    if (code) {
      codeEl.textContent = code;
      codeEl.classList.remove("hidden");
      location.href = "rtlapse://oauth-callback" + location.search;
    } else {
      document.getElementById("title").textContent = "OAuth callback";
      document.getElementById("msg").textContent =
        "This page receives authorization redirects for the RTlapse app. Nothing to do here.";
    }
  })();
</script>
</body>
</html>
